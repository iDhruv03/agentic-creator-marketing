name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - name: Install
        run: npm --prefix server ci && npm --prefix client ci
      - name: Typecheck
        run: npm --prefix server run typecheck && npm --prefix client run typecheck
      - name: Test (governance, ledger, audit chain, agent runtime)
        run: npm --prefix server test
      - name: Build
        run: npm --prefix server run build && npm --prefix client run build
  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t cmi:ci .
