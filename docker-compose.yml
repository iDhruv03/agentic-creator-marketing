services:
  cmi:
    build: .
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      NODE_ENV: production
      CMI_PAYMENT_THRESHOLD: 1000
      CMI_AUTH_SECRET: ${CMI_AUTH_SECRET:-change-me}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - cmi-data:/app/server/data
    restart: unless-stopped

volumes:
  cmi-data:
